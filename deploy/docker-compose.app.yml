version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: santia-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - santia

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: santia-backend
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      - mongo
    ports:
      - "8001:8001"
    networks:
      - santia

  frontend:
    image: nginx:alpine
    container_name: santia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/build:/usr/share/nginx/html:ro
    networks:
      - santia

networks:
  santia:
    name: santia

volumes:
  mongo_data:
